<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetBar taskbar</title>
  <link rel="stylesheet" href="widget.css">
  <script type="module" src="widget.js"></script>
</head>
<body>
  <main class="widget" aria-label="Network traffic" tabindex="0">
    <div class="readings">
      <div class="reading upload">
        <svg class="reading-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="icons/feather.svg#arrow-up"></use>
        </svg>
        <span id="upload">—</span>
      </div>
      <div class="reading download">
        <svg class="reading-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="icons/feather.svg#arrow-down"></use>
        </svg>
        <span id="download">—</span>
      </div>
    </div>
    <canvas aria-hidden="true" hidden></canvas>
  </main>
</body>
</html>
