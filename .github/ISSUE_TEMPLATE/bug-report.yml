name: Bug report
description: Report a problem with NetBar on Windows
labels: ["bug"]
body:
  - type: input
    id: netbar
    attributes:
      label: NetBar version
      description: Find the version in Settings.
      placeholder: "2.2.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Find the version and OS build by running winver.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the display mode, scaling, and monitor layout when relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected
    validations:
      required: true
