name: Publish NetBar MSI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: netbar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the MSI
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the version and build the installer
        id: package
        shell: pwsh
        env:
          NETBAR_UPDATE_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'netbar').version
          if (!$version -or $env:GITHUB_REF_NAME -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
              throw 'The Git tag must match the stable version in Cargo.toml.'
          }
          cargo test --locked
          pwsh -NoProfile -File .\scripts\release.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test the upgrade from the original NetBar 1.3.0 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File .\scripts\verify-package.ps1
          pwsh -NoProfile -File .\scripts\test-installer.ps1

      - name: Prepare release notes
        shell: pwsh
        env:
          NETBAR_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Escape($env:NETBAR_VERSION)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$version\][^\r\n]*\r?\n(.*?)(?=^## |^\[|\z)")
          if ($section.Success) {
              $section.Groups[1].Value.Trim() | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8
          }

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netbar-windows-x64
          path: |
            dist/NetBar-${{ steps.package.outputs.version }}-Setup-x64.msi
            dist/NetBar-${{ steps.package.outputs.version }}-SHA256.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: netbar-windows-x64
          path: dist
      - name: Publish the installer and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NETBAR_VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$NETBAR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$NETBAR_VERSION" ]]
          cd dist
          installer="NetBar-$NETBAR_VERSION-Setup-x64.msi"
          checksum="NetBar-$NETBAR_VERSION-SHA256.txt"
          sha256sum --check "$checksum"
          if [[ -s release-notes.md ]]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "$installer" "$checksum" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "NetBar $NETBAR_VERSION" --latest "${notes[@]}"
