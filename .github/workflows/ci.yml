name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: netbar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Format, lint and test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Rust formatting and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo fmt --manifest-path installer/actions/Cargo.toml -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo clippy --locked --manifest-path installer/actions/Cargo.toml --all-targets -- -D warnings
